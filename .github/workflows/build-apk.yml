name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          if [ -f settings.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f weibo-chaohua-android/settings.gradle ]; then
            echo "dir=weibo-chaohua-android" >> "$GITHUB_OUTPUT"
          else
            echo "Cannot find settings.gradle"
            find . -maxdepth 3 -name settings.gradle
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p "${{ steps.locate.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weibo-chaohua-viewer-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
